<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物资补录 · 物资管理系统</title>
  <link rel="stylesheet" href="../css/tailwind.css" />
  <link rel="stylesheet" href="../css/custom.css" />
  <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css" />
</head>
<body data-page="outside_count_plan_list" data-title="物资补录" data-breadcrumb="库外盘点 / 物资补录">
  <div id="main-content">
    <div data-wms-modal data-modal-back="outside_count_plan_list.html" data-modal-size="xl">
      <div class="wms-modal-form wms-warehouse-form">
        <div class="wms-form-section md:col-span-2"><h3 class="wms-form-section-title">计划摘要</h3></div>
        <div class="md:col-span-2 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <p class="font-medium text-slate-900" id="plan-title">6月库外综合盘点</p>
              <p class="mt-1 text-xs text-slate-500">计划 <span id="plan-no">KWP202606290001</span> · 状态 <span id="plan-status" class="font-medium text-amber-700">盘点中</span></p>
            </div>
            <span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-violet-50 text-violet-700 ring-violet-600/20">手工补录 · 仅 PC</span>
          </div>
        </div>

        <div class="md:col-span-2 rounded-xl border border-violet-100 bg-violet-50/70 px-4 py-3 text-sm text-violet-950">
          管理员<strong>完全手工新建</strong>应盘行（可不在库外台账）。本期<strong>不回写</strong>台账；结果与盘点报告中标记「补录」。指定确认人仅在 <strong>PC「物资盘点」</strong>确认，不推送企微。
        </div>

        <div class="wms-form-section md:col-span-2"><h3 class="wms-form-section-title">补录物资</h3></div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700"><span class="text-rose-500">*</span> 资产类型</label>
          <select id="asset-type" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm">
            <option value="固资">固定资产</option>
            <option value="类资产">类资产</option>
          </select>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700">物资编码</label>
          <input id="code" type="text" placeholder="固资可空，确认时可补码" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700"><span class="text-rose-500">*</span> 物资名称</label>
          <input id="name" type="text" placeholder="例如：临时加盘电钻" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700"><span class="text-rose-500">*</span> 账存数量</label>
          <input id="book" type="number" min="1" value="1" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700"><span class="text-rose-500">*</span> 使用地点</label>
          <input id="loc" type="text" placeholder="例如：城东项目部" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700"><span class="text-rose-500">*</span> 指定确认人</label>
          <div class="flex gap-2">
            <input id="owner" type="text" readonly placeholder="请选择确认人" class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm" />
            <button type="button" id="btn-pick-owner" class="wms-btn wms-btn-secondary shrink-0 text-sm">选人</button>
          </div>
          <p class="mt-1 text-xs text-slate-500">对接通讯录选人（原型演示）</p>
        </div>
        <div class="md:col-span-2">
          <label class="mb-1.5 block text-sm font-medium text-slate-700">补录说明</label>
          <textarea id="note" rows="2" placeholder="选填，如：领导要求加盘，不在原计划范围" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"></textarea>
        </div>

        <div class="wms-form-section md:col-span-2 flex items-center justify-between">
          <h3 class="wms-form-section-title !mb-0">本次已加入补录清单</h3>
          <button type="button" id="btn-add-row" class="wms-btn wms-btn-secondary text-sm">
            <i class="fa-solid fa-plus mr-1 text-xs"></i>加入清单
          </button>
        </div>
        <div class="md:col-span-2 overflow-hidden rounded-xl border border-slate-200 bg-white">
          <div class="overflow-x-auto wms-modal-table-wrap">
            <table class="min-w-full text-sm">
              <thead class="bg-slate-50/80">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">来源</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">类型</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">编码</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">名称</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">地点</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">账存</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500">确认人</th>
                  <th class="px-4 py-3 text-right text-xs font-semibold text-slate-500">操作</th>
                </tr>
              </thead>
              <tbody id="list-tbody">
                <tr class="border-t border-slate-100">
                  <td colspan="8" class="px-4 py-10 text-center text-sm text-slate-400">暂无补录行，请填写上方表单后「加入清单」</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="wms-modal-footer">
        <a href="outside_count_plan_list.html" class="wms-btn wms-btn-secondary">取消</a>
        <button type="button" class="wms-btn wms-btn-primary" id="btn-submit">提交补录</button>
      </div>
    </div>
  </div>

  <div id="person-mask" class="fixed inset-0 hidden items-center justify-center bg-slate-900/40 p-4" style="z-index:300">
    <div class="w-full max-w-md overflow-hidden rounded-2xl bg-white shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
        <h3 class="text-base font-semibold text-slate-900">选择确认人</h3>
        <button type="button" id="person-close" class="rounded-lg p-2 text-slate-400 hover:bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="max-h-72 overflow-auto p-2">
        <button type="button" class="person-opt flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left hover:bg-slate-50" data-name="王工" data-dept="工程部">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-sm font-medium text-slate-700">王</span>
          <span><span class="block text-sm font-medium text-slate-900">王工</span><span class="block text-xs text-slate-500">工程部</span></span>
        </button>
        <button type="button" class="person-opt flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left hover:bg-slate-50" data-name="李工" data-dept="设备部">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-sm font-medium text-slate-700">李</span>
          <span><span class="block text-sm font-medium text-slate-900">李工</span><span class="block text-xs text-slate-500">设备部</span></span>
        </button>
        <button type="button" class="person-opt flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left hover:bg-slate-50" data-name="张工" data-dept="工程部">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-sm font-medium text-slate-700">张</span>
          <span><span class="block text-sm font-medium text-slate-900">张工</span><span class="block text-xs text-slate-500">工程部</span></span>
        </button>
        <button type="button" class="person-opt flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left hover:bg-slate-50" data-name="赵六" data-dept="维保部">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-sm font-medium text-slate-700">赵</span>
          <span><span class="block text-sm font-medium text-slate-900">赵六</span><span class="block text-xs text-slate-500">维保部</span></span>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-8 left-1/2 z-[110] hidden -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm text-white shadow-lg"></div>

  <script src="../js/layout.js" charset="UTF-8"></script>
  <script>
    (function () {
      function boot() {
        var rows = [];
        var toast = document.getElementById('toast');
        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.remove('hidden');
          setTimeout(function () { toast.classList.add('hidden'); }, 2000);
        }

        var params = new URLSearchParams(location.search);
        if (params.get('planNo')) document.getElementById('plan-no').textContent = params.get('planNo');
        if (params.get('status') === '草稿') {
          document.getElementById('plan-status').textContent = '草稿';
          document.getElementById('plan-status').className = 'font-medium text-slate-700';
          document.getElementById('plan-title').textContent = '7月库外草稿';
        }

        function typeBadge(t) {
          if (t === '固资') return '<span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-slate-100 text-slate-700 ring-slate-600/10">固资</span>';
          return '<span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-sky-50 text-sky-700 ring-sky-600/20">类资产</span>';
        }

        function renderList() {
          var tbody = document.getElementById('list-tbody');
          tbody.innerHTML = '';
          if (!rows.length) {
            tbody.innerHTML = '<tr class="border-t border-slate-100"><td colspan="8" class="px-4 py-10 text-center text-sm text-slate-400">暂无补录行，请填写上方表单后「加入清单」</td></tr>';
            return;
          }
          rows.forEach(function (r, i) {
            var tr = document.createElement('tr');
            tr.className = 'border-t border-slate-100';
            tr.innerHTML =
              '<td class="px-4 py-2.5"><span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-violet-50 text-violet-700 ring-violet-600/20">补录</span></td>' +
              '<td class="px-4 py-2.5">' + typeBadge(r.type) + '</td>' +
              '<td class="px-4 py-2.5 font-mono text-xs">' + (r.code || '—') + '</td>' +
              '<td class="px-4 py-2.5">' + r.name + '</td>' +
              '<td class="px-4 py-2.5">' + r.loc + '</td>' +
              '<td class="px-4 py-2.5">' + r.book + '</td>' +
              '<td class="px-4 py-2.5">' + r.owner + '</td>' +
              '<td class="px-4 py-2.5 text-right"><button type="button" class="text-slate-600 hover:underline" data-rm="' + i + '">移除</button></td>';
            tbody.appendChild(tr);
          });
        }

        function openPerson() {
          var m = document.getElementById('person-mask');
          if (m && m.parentNode !== document.body) {
            document.body.appendChild(m);
          }
          m.style.zIndex = '300';
          m.classList.remove('hidden');
          m.classList.add('flex');
        }
        function closePerson() {
          var m = document.getElementById('person-mask');
          m.classList.add('hidden');
          m.classList.remove('flex');
        }

        document.getElementById('btn-pick-owner').addEventListener('click', openPerson);
        document.getElementById('person-close').addEventListener('click', closePerson);
        document.querySelectorAll('.person-opt').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.getElementById('owner').value = btn.getAttribute('data-name') + '（' + btn.getAttribute('data-dept') + '）';
            document.getElementById('owner').dataset.name = btn.getAttribute('data-name');
            closePerson();
          });
        });

        document.getElementById('btn-add-row').addEventListener('click', function () {
          var name = (document.getElementById('name').value || '').trim();
          var book = Number(document.getElementById('book').value);
          var loc = (document.getElementById('loc').value || '').trim();
          var owner = document.getElementById('owner').dataset.name || '';
          if (!name) { showToast('请填写物资名称'); return; }
          if (!book || book < 1) { showToast('请填写有效账存数量'); return; }
          if (!loc) { showToast('请填写使用地点'); return; }
          if (!owner) { showToast('请指定确认人'); return; }
          rows.push({
            type: document.getElementById('asset-type').value,
            code: (document.getElementById('code').value || '').trim(),
            name: name,
            book: book,
            loc: loc,
            owner: owner,
            note: (document.getElementById('note').value || '').trim()
          });
          document.getElementById('name').value = '';
          document.getElementById('code').value = '';
          document.getElementById('book').value = '1';
          document.getElementById('note').value = '';
          renderList();
          showToast('已加入补录清单');
        });

        document.getElementById('list-tbody').addEventListener('click', function (e) {
          var btn = e.target.closest('[data-rm]');
          if (!btn) return;
          rows.splice(Number(btn.getAttribute('data-rm')), 1);
          renderList();
        });

        document.getElementById('btn-submit').addEventListener('click', function () {
          if (!rows.length) {
            showToast('请先加入至少 1 行补录物资');
            return;
          }
          showToast('已提交 ' + rows.length + ' 行补录（计入应盘与报告，不回写台账）');
          setTimeout(function () { location.href = 'outside_count_plan_list.html'; }, 900);
        });

        renderList();
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 0); });
      } else {
        setTimeout(boot, 0);
      }
    })();
  </script>
</body></html>
