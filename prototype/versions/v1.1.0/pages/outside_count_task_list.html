<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>盘点进度 · 物资管理系统</title>
  <link rel="stylesheet" href="../css/tailwind.css" />
  <link rel="stylesheet" href="../css/custom.css" />
  <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css" />
</head>
<body data-page="outside_count_task_list" data-title="盘点进度" data-breadcrumb="库外盘点 / 盘点进度">
  <div id="main-content">
    <div data-wms-list-page>
      <p class="mb-4 text-sm text-slate-500">库外盘点<strong>无执行人任务单</strong>：出库领用人即归属人，各自确认名下物资。按<strong>盘点计划</strong>切换查看；默认当前盘点中计划。固资可单件转派；类资产按地点录数量、不可转派。</p>

      <div class="mb-4 flex flex-wrap items-end gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="min-w-[240px] flex-1">
          <label class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">盘点计划</label>
          <select id="plan-switch" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200">
            <option value="doing" selected>KWP202606290001 · 6月库外综合盘点（盘点中）</option>
            <option value="done">KWP202606200001 · 6月库外类资产盘点（已结束）</option>
            <option value="ended">KWP202606010001 · 5月库外全量盘点（已结束·已有报告）</option>
          </select>
        </div>
        <div class="text-sm text-slate-500 pb-2.5" id="plan-meta">状态：盘点中 · 口径 2026-06-29 · 缺地点 1 · 固资待转派 1</div>
      </div>

      <div class="mb-4 flex flex-wrap gap-2" data-wms-list-tabs>
        <button type="button" class="wms-list-tab rounded-xl px-4 py-2 text-sm font-medium bg-slate-900 text-white" data-wms-list-tab="全部">全部归属人</button>
        <button type="button" class="wms-list-tab rounded-xl px-4 py-2 text-sm font-medium bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50" data-wms-list-tab="未完成">未完成确认</button>
        <button type="button" class="wms-list-tab rounded-xl px-4 py-2 text-sm font-medium bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50" data-wms-list-tab="已完成">已完成确认</button>
      </div>

      <div class="mb-4 flex w-full flex-nowrap items-center justify-end gap-2 overflow-x-auto" data-wms-list-toolbar>
        <div class="relative shrink-0 w-[280px]">
          <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400"></i>
          <input type="search" data-wms-list-search placeholder="领用人、部门" class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-9 pr-9 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200" />
          <button type="button" data-wms-list-search-clear class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" title="清空"><i class="fa-solid fa-xmark text-xs"></i></button>
        </div>
      </div>

      <div class="card overflow-hidden rounded-2xl bg-white shadow-sm" data-wms-list-card>
        <div class="overflow-x-auto wms-modal-table-wrap" data-wms-list-table-wrap>
          <table class="min-w-full wms-data-table">
            <thead class="bg-slate-50/80">
              <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">领用人（归属人）</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">部门</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">应确认行</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">已确认</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">待填地点</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">固资待转派</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">进度</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">确认状态</th>
                <th class="wms-col-actions px-4 py-3 text-right text-xs font-semibold uppercase tracking-wide text-slate-500 whitespace-nowrap">操作</th>
              </tr>
            </thead>
            <tbody data-wms-list-tbody id="owner-tbody">
              <!-- filled by script for plan switch demo -->
            </tbody>
          </table>
        </div>
        <div class="hidden py-16 text-center" data-wms-list-empty>
          <i class="fa-solid fa-inbox mb-3 text-3xl text-slate-300"></i>
          <p class="text-sm text-slate-500">无匹配数据，请调整筛选条件</p>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 px-4 py-3 text-sm text-slate-500">
          <span data-wms-list-count id="row-count">共 0 条</span>
          <div class="flex flex-wrap items-center gap-2">
            <div class="flex gap-1"><span class="rounded-lg bg-slate-900 px-3 py-1 text-white">1</span></div>
            <span class="text-slate-400">10 条/页</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/layout.js" charset="UTF-8"></script>
  <script>
    (function () {
      var plans = {
        doing: {
          meta: '状态：盘点中 · 口径 2026-06-29 · 缺地点 1 · 固资待转派 1',
          rows: [
            { owner: '王工', dept: '工程部', total: 20, done: 8, loc: 1, transfer: 1, status: '未完成', pct: 40 },
            { owner: '李工', dept: '设备部', total: 18, done: 0, loc: 0, transfer: 0, status: '未完成', pct: 0 },
            { owner: '赵六', dept: '维保部', total: 6, done: 6, loc: 0, transfer: 0, status: '已完成', pct: 100 }
          ]
        },
        done: {
          meta: '状态：已结束 · 口径 2026-06-20 · 缺地点 0 · 固资待转派 0',
          rows: [
            { owner: '赵六', dept: '维保部', total: 12, done: 12, loc: 0, transfer: 0, status: '已完成', pct: 100 },
            { owner: '钱七', dept: '安全部', total: 10, done: 10, loc: 0, transfer: 0, status: '已完成', pct: 100 }
          ]
        },
        ended: {
          meta: '状态：已结束 · 口径 2026-06-01 · 报告已生成',
          rows: [
            { owner: '王工', dept: '工程部', total: 40, done: 40, loc: 0, transfer: 0, status: '已完成', pct: 100 }
          ]
        }
      };
      var tbody = document.getElementById('owner-tbody');
      var meta = document.getElementById('plan-meta');
      var countEl = document.getElementById('row-count');

      function statusBadge(s) {
        if (s === '已完成') return '<span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-emerald-50 text-emerald-700 ring-emerald-600/20">已完成确认</span>';
        return '<span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-amber-50 text-amber-700 ring-amber-600/20">未完成确认</span>';
      }
      function render(key) {
        var p = plans[key] || plans.doing;
        meta.textContent = p.meta;
        tbody.innerHTML = '';
        p.rows.forEach(function (r) {
          var tr = document.createElement('tr');
          tr.className = 'border-t border-slate-100 hover:bg-slate-50/80';
          tr.setAttribute('data-wms-list-row', '');
          tr.setAttribute('data-list-tab', r.status === '已完成' ? '已完成' : '未完成');
          tr.setAttribute('data-list-search', (r.owner + ' ' + r.dept).toLowerCase());
          tr.innerHTML =
            '<td class="px-4 py-3.5 text-sm text-slate-700 whitespace-nowrap">' + r.owner + '</td>' +
            '<td class="px-4 py-3.5 text-sm text-slate-700 whitespace-nowrap">' + r.dept + '</td>' +
            '<td class="px-4 py-3.5 text-sm text-slate-700 whitespace-nowrap">' + r.total + '</td>' +
            '<td class="px-4 py-3.5 text-sm text-slate-700 whitespace-nowrap">' + r.done + '</td>' +
            '<td class="px-4 py-3.5 text-sm whitespace-nowrap ' + (r.loc ? 'text-amber-700' : 'text-slate-700') + '">' + r.loc + '</td>' +
            '<td class="px-4 py-3.5 text-sm text-slate-700 whitespace-nowrap">' + r.transfer + '</td>' +
            '<td class="px-4 py-3.5 text-sm text-slate-700 whitespace-nowrap"><div class="min-w-[92px]"><div class="mb-1 flex justify-between text-xs text-slate-500"><span>' + r.done + '/' + r.total + '</span><span>' + r.pct + '%</span></div><div class="h-1.5 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full bg-sky-500" style="width:' + r.pct + '%"></div></div></div></td>' +
            '<td class="px-4 py-3.5 text-sm text-slate-700 whitespace-nowrap">' + statusBadge(r.status) + '</td>' +
            '<td class="wms-col-actions px-4 py-3.5 text-slate-900 text-right text-sm whitespace-nowrap"><a href="outside_count_task_detail.html?plan=' + key + '&owner=' + encodeURIComponent(r.owner) + '" class="hover:underline">查看物资</a></td>';
          tbody.appendChild(tr);
        });
        countEl.textContent = '共 ' + p.rows.length + ' 条';
        // rebind list filters if layout already init
        if (window.WMS && typeof window.WMS.refreshListPage === 'function') window.WMS.refreshListPage();
      }
      document.getElementById('plan-switch').addEventListener('change', function () {
        render(this.value);
      });
      render('doing');
    })();
  </script>
</body></html>
