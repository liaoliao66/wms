<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V1.0.1 核心业务职能泳道图</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden; /* 整页无滚动条：图随视口自适应 */
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 8px 10px 10px;
      gap: 6px;
    }
    .bar { flex: 0 0 auto; font-size: 13px; }
    .bar a { color: #1d4ed8; text-decoration: none; margin-right: 12px; }
    .note { flex: 0 0 auto; font-size: 12px; color: #475569; line-height: 1.4; margin: 0; }
    .wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      width: 100%;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .legend {
      flex: 0 0 auto;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 11px;
      overflow: hidden;
    }
    .legend table { width: 100%; border-collapse: collapse; }
    .legend th, .legend td { border: 1px solid #cbd5e1; padding: 5px 8px; text-align: left; }
    .legend th { background: #f1f5f9; }
    /* 嵌入 PRD：只出图，高度由父页按内容拉长，无固定矮条 */
    html.embed, html.embed body {
      height: auto;
      min-height: 0;
      overflow: visible;
    }
    html.embed body {
      display: block;
      padding: 0;
      background: #fff;
    }
    html.embed .bar,
    html.embed .note,
    html.embed .legend { display: none; }
    html.embed .wrap {
      border: none;
      overflow: visible;
      height: auto;
    }
    html.embed svg {
      width: 100%;
      height: auto;
      aspect-ratio: 780 / 760;
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="prd.html">← 返回 PRD</a>
    <a href="../index.html">v1.0.1 门户</a>
  </div>
  <p class="note">
    连线规则：列内竖走、跨列平走；采购泳道内<strong>左轨急件 / 右轨一般</strong>，在节点上方分轨后向下汇合，避免交叉。
  </p>

  <div class="wrap">
    <!-- 压缩坐标：原 1040×1160 → 780×760，纵向收掉入库→领用空白 -->
    <svg viewBox="0 0 780 760" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="V1.0.1 职能泳道图">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0 L10 5 L0 10 z" fill="#64748b" />
        </marker>
      </defs>

      <!-- 标题 -->
      <rect x="0" y="0" width="780" height="32" fill="#475569" />
      <text x="390" y="21" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">V1.0.1 物资计划采购与领用 · 职能泳道图</text>

      <!-- 泳道头：需求0-195 | 采购195-420 | 供应商420-600 | 仓库600-780 -->
      <rect x="0" y="32" width="195" height="26" fill="#e2e8f0" />
      <rect x="195" y="32" width="225" height="26" fill="#e2e8f0" />
      <rect x="420" y="32" width="180" height="26" fill="#e2e8f0" />
      <rect x="600" y="32" width="180" height="26" fill="#e2e8f0" />
      <text x="97" y="50" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">需求部门</text>
      <text x="307" y="50" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">采购部门（左急件 / 右一般）</text>
      <text x="510" y="50" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">供应商</text>
      <text x="690" y="50" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">仓库部门</text>

      <line x1="195" y1="32" x2="195" y2="760" stroke="#64748b" />
      <line x1="420" y1="32" x2="420" y2="760" stroke="#64748b" />
      <line x1="600" y1="32" x2="600" y2="760" stroke="#64748b" />
      <line x1="0" y1="58" x2="780" y2="58" stroke="#64748b" />
      <line x1="307" y1="150" x2="307" y2="340" stroke="#94a3b8" stroke-dasharray="3 3" />

      <!-- ===== 节点：需求 ===== -->
      <ellipse cx="97" cy="90" rx="68" ry="20" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2" />
      <text x="97" y="87" text-anchor="middle" font-size="11">开始</text>
      <text x="97" y="100" text-anchor="middle" font-size="11">编制物资计划</text>

      <polygon points="97,128 138,158 97,188 56,158" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
      <text x="97" y="155" text-anchor="middle" font-size="11" font-weight="600">计划审核?</text>
      <text x="97" y="168" text-anchor="middle" font-size="9">通过?</text>

      <polygon points="97,218 150,255 97,292 44,255" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" />
      <text x="97" y="252" text-anchor="middle" font-size="11" font-weight="600">计划类型?</text>
      <text x="97" y="265" text-anchor="middle" font-size="9">急件 / 一般</text>

      <rect x="32" y="330" width="130" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="97" y="344" text-anchor="middle" font-size="11">作为领用申请依据</text>
      <text x="97" y="358" text-anchor="middle" font-size="10" fill="#334155">急件 / 一般均生效</text>

      <ellipse cx="97" cy="560" rx="66" ry="18" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2" />
      <text x="97" y="564" text-anchor="middle" font-size="11">发起领用申请</text>

      <ellipse cx="97" cy="700" rx="66" ry="18" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2" />
      <text x="97" y="704" text-anchor="middle" font-size="11">确认归还 · 结束</text>

      <!-- ===== 节点：采购约束 ===== -->
      <rect x="205" y="68" width="205" height="26" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" />
      <text x="307" y="85" text-anchor="middle" font-size="10" fill="#64748b">约束：本期禁止手工新建物资采购</text>

      <!-- 急件轨（左，中心250） -->
      <rect x="202" y="185" width="96" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="250" y="201" text-anchor="middle" font-size="10">生成 1 张</text>
      <text x="250" y="214" text-anchor="middle" font-size="10">采购待执行单</text>

      <rect x="202" y="255" width="96" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="250" y="271" text-anchor="middle" font-size="10">唯一供应商</text>
      <text x="250" y="284" text-anchor="middle" font-size="10">直采提交·需审</text>

      <!-- 一般轨（右，中心365） -->
      <rect x="317" y="185" width="96" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="365" y="201" text-anchor="middle" font-size="10">按行生成待采</text>
      <text x="365" y="214" text-anchor="middle" font-size="10">仅一般计划</text>

      <rect x="317" y="255" width="96" height="40" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="365" y="271" text-anchor="middle" font-size="10">JJSQ 审核通过</text>
      <text x="365" y="284" text-anchor="middle" font-size="10">→物资采购</text>

      <!-- 汇合：两侧均经物资采购后再供货 -->
      <rect x="220" y="330" width="170" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="305" y="344" text-anchor="middle" font-size="11">物资采购通过后供货</text>
      <text x="305" y="358" text-anchor="middle" font-size="10" fill="#334155">急件与一般汇合</text>

      <!-- ===== 供应商 ===== -->
      <rect x="440" y="330" width="140" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="510" y="344" text-anchor="middle" font-size="11">提供货物及送货单</text>
      <text x="510" y="358" text-anchor="middle" font-size="10" fill="#334155">供货</text>

      <ellipse cx="510" cy="410" rx="58" ry="16" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2" />
      <text x="510" y="414" text-anchor="middle" font-size="11">供货完成</text>

      <!-- ===== 仓库 ===== -->
      <rect x="620" y="330" width="140" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="690" y="344" text-anchor="middle" font-size="11">验收</text>
      <text x="690" y="356" text-anchor="middle" font-size="9" fill="#475569">计划人+需求人</text>

      <rect x="620" y="390" width="140" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="690" y="404" text-anchor="middle" font-size="11">出具入库单 / 入库</text>
      <text x="690" y="418" text-anchor="middle" font-size="10" fill="#334155">账本更新</text>

      <rect x="620" y="542" width="140" height="36" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="690" y="556" text-anchor="middle" font-size="11">领用审核 · 出库</text>
      <text x="690" y="570" text-anchor="middle" font-size="10" fill="#334155">依据急件/一般计划</text>

      <rect x="620" y="620" width="140" height="32" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" />
      <text x="690" y="640" text-anchor="middle" font-size="11">归还入库</text>

      <!-- ===== 连线（正交、无交叉） ===== -->

      <path d="M97 110 L97 128" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />

      <!-- 审核否：最左侧回流 -->
      <path d="M56 158 L16 158 L16 90 L29 90" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="8" y="128" fill="#64748b" font-size="10" font-weight="700">否</text>

      <!-- 审核是 → 类型 -->
      <path d="M97 188 L97 218" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="106" y="206" fill="#64748b" font-size="10" font-weight="700">是</text>

      <!-- 急件：菱形 → 上方 Y=170 → 左轨 -->
      <path d="M130 236 L150 236 L150 170 L250 170 L250 185" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="185" y="164" fill="#64748b" font-size="10" font-weight="700">急件·通过</text>

      <path d="M250 225 L250 255" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <path d="M250 295 L250 330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />

      <!-- 一般：更高横线 Y=155，避免与急件交叉 -->
      <path d="M130 274 L165 274 L165 155 L365 155 L365 185" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="250" y="149" fill="#64748b" font-size="10" font-weight="700">一般·通过</text>

      <path d="M365 225 L365 255" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <path d="M365 295 L365 330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />

      <!-- 类型 → 领用依据 -->
      <path d="M97 292 L97 330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />

      <!-- 供货 → 供应商 → 仓库 -->
      <path d="M390 348 L440 348" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <path d="M580 348 L620 348" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />

      <path d="M510 366 L510 394" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <path d="M690 362 L690 390" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />

      <!-- 领用依据 → 发起领用（左缘下行） -->
      <path d="M32 348 L20 348 L20 560 L31 560" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="10" y="450" fill="#64748b" font-size="10" font-weight="700">入库后可领</text>

      <!-- 发起领用 → 领用审核 -->
      <path d="M163 560 L620 560" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />

      <path d="M690 578 L690 620" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
      <text x="700" y="602" fill="#64748b" font-size="10" font-weight="700">需归还</text>

      <!-- 归还 → 确认 -->
      <path d="M620 636 L20 636 L20 700 L31 700" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)" />
    </svg>
  </div>

  <div class="legend">
    <table>
      <thead>
        <tr>
          <th>图形</th>
          <th>含义</th>
          <th>分支</th>
          <th>采购路径</th>
          <th>领用</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>浅灰胶囊</td>
          <td>开始 / 结束</td>
          <td>急件（左轨）</td>
          <td>自动采购单 → 直采审核 → 供货 → 验收 → 入库</td>
          <td>是</td>
        </tr>
        <tr>
          <td>浅灰菱形</td>
          <td>判断</td>
          <td>一般（右轨）</td>
          <td>待采 → JJSQ → 物资采购 → 供货 → 验收 → 入库</td>
          <td>是</td>
        </tr>
        <tr>
          <td>白底矩形</td>
          <td>处理步骤</td>
          <td colspan="3">灰线箭头 = 连线；整体为 Slate 中性色，避免高饱和</td>
        </tr>
      </tbody>
    </table>
  </div>
  <script>
    (function () {
      var embedded = window.self !== window.top;
      if (embedded) document.documentElement.classList.add('embed');

      function contentHeight() {
        var wrap = document.querySelector('.wrap');
        var svg = document.querySelector('svg');
        if (!wrap || !svg) return 0;
        var w = wrap.clientWidth || document.documentElement.clientWidth || 780;
        return Math.ceil(w * (760 / 780));
      }

      function notifyParent() {
        if (!embedded || !window.parent) return;
        var h = contentHeight();
        if (h < 120) return;
        try {
          window.parent.postMessage({ type: 'wms-swimlane-resize', height: h }, '*');
        } catch (e) {}
      }

      if (embedded) {
        if (document.readyState === 'complete') notifyParent();
        else window.addEventListener('load', notifyParent);
        window.addEventListener('resize', notifyParent);
        if (window.ResizeObserver) {
          var ro = new ResizeObserver(notifyParent);
          ro.observe(document.documentElement);
        }
      }
    })();
  </script>
</body>
</html>
