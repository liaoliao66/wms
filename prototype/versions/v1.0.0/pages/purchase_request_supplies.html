<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>已生成供货单 · 物资管理系统</title>
  <link rel="stylesheet" href="../css/tailwind.css" />
  <link rel="stylesheet" href="../css/custom.css" />
  <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css" />
</head>
<body data-page="purchase_request_list" data-title="已生成供货单" data-breadcrumb="采购管理 / 已生成供货单">
  <div id="main-content">
    <div data-wms-modal data-modal-back="purchase_request_list.html" data-modal-size="lg" data-wms-request-supplies>
      <div class="mb-4 rounded-xl border border-slate-200 bg-slate-50/80 px-4 py-3 text-sm text-slate-700">
        <i class="fa-solid fa-truck mr-1 text-slate-500"></i>采购申请
        <span class="font-mono font-medium text-slate-900" data-request-supplies-no>JJSQ202606050001</span>
        <span class="mx-2 text-slate-300">·</span>以下为审核通过后按供应商/物资拆分的供货单（只读）
      </div>
      <div class="overflow-hidden rounded-xl border border-slate-200">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-50/80">
            <tr>
              <th class="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">供货单号</th>
              <th class="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">供应商</th>
              <th class="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">物资</th>
              <th class="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">需求/已供</th>
              <th class="px-3 py-2.5 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">状态</th>
              <th class="px-3 py-2.5 text-right text-xs font-semibold uppercase tracking-wide text-slate-500">操作</th>
            </tr>
          </thead>
          <tbody data-request-supplies-tbody>
            <tr class="border-t border-slate-100">
              <td class="px-3 py-2.5 font-mono text-xs text-slate-800">GH2025001</td>
              <td class="px-3 py-2.5 text-slate-700">科尼</td>
              <td class="px-3 py-2.5 text-slate-700">抓斗</td>
              <td class="px-3 py-2.5 text-slate-700">10 / 10 个</td>
              <td class="px-3 py-2.5"><span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-emerald-50 text-emerald-700 ring-emerald-600/20">已供货</span></td>
              <td class="px-3 py-2.5 text-right"><a href="warehouse_acceptance_detail.html?no=GH2025001&amp;back=purchase_request_supplies.html%3FrequestNo%3DJJSQ202606050001" class="text-sm hover:underline" data-wms-supply-view-link data-supply-no="GH2025001">查看</a></td>
            </tr>
            <tr class="border-t border-slate-100">
              <td class="px-3 py-2.5 font-mono text-xs text-slate-800">GH2025002</td>
              <td class="px-3 py-2.5 text-slate-700">上海佩纳</td>
              <td class="px-3 py-2.5 text-slate-700">料斗</td>
              <td class="px-3 py-2.5 text-slate-700">10 / 10 个</td>
              <td class="px-3 py-2.5"><span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-emerald-50 text-emerald-700 ring-emerald-600/20">已供货</span></td>
              <td class="px-3 py-2.5 text-right"><a href="warehouse_acceptance_detail.html?no=GH2025002&amp;back=purchase_request_supplies.html%3FrequestNo%3DJJSQ202606050001" class="text-sm hover:underline" data-wms-supply-view-link data-supply-no="GH2025002">查看</a></td>
            </tr>
            <tr class="border-t border-slate-100">
              <td class="px-3 py-2.5 font-mono text-xs text-slate-800">GH2025003</td>
              <td class="px-3 py-2.5 text-slate-700">河南蒲瑞</td>
              <td class="px-3 py-2.5 text-slate-700">钢丝绳</td>
              <td class="px-3 py-2.5 text-slate-700">100 / 50 m</td>
              <td class="px-3 py-2.5"><span class="inline-flex rounded-lg px-2 py-0.5 text-xs font-medium ring-1 ring-inset bg-amber-50 text-amber-700 ring-amber-600/20">供货中</span></td>
              <td class="px-3 py-2.5 text-right"><a href="warehouse_acceptance_detail.html?no=GH2025003&amp;back=purchase_request_supplies.html%3FrequestNo%3DJJSQ202606050001" class="text-sm hover:underline" data-wms-supply-view-link data-supply-no="GH2025003">查看</a></td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="wms-modal-footer">
        <a href="purchase_request_list.html" class="wms-btn wms-btn-secondary" data-request-supplies-close>关闭</a>
      </div>
    </div>
  </div>
  <script src="../js/layout.js" charset="UTF-8"></script>
</body>
</html>
